<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="650" fill="#ffffff"/>

  <text x="30" y="38" font-size="21" font-weight="700" fill="#0f172a">Форма за сигнали — архитектура</text>
  <text x="30" y="60" font-size="12.5" fill="#64748b">Без собствен сървър: Cloudflare обслужва формата и пощата, GitHub Actions сканира файловете.</text>

  <!-- people -->
  <rect x="30" y="112" width="150" height="62" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="105" y="138" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Подател</text>
  <text x="105" y="158" font-size="11.5" fill="#334155" text-anchor="middle">браузър</text>

  <rect x="770" y="300" width="200" height="62" rx="10" fill="#eff6ff" stroke="#2563eb"/>
  <text x="870" y="326" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Получател</text>
  <text x="870" y="346" font-size="11.5" fill="#334155" text-anchor="middle">поща на институцията</text>

  <!-- Cloudflare zone -->
  <rect x="230" y="84" width="490" height="340" rx="14" fill="#fff7ed" stroke="#f48120"/>
  <text x="246" y="103" font-size="11" font-weight="700" fill="#c2570c" letter-spacing="1">CLOUDFLARE</text>

  <rect x="250" y="112" width="450" height="112" rx="10" fill="#ffffff" stroke="#f48120"/>
  <text x="266" y="136" font-size="14" font-weight="700" fill="#9a3f00">Worker · report.&lt;домейн&gt;</text>
  <text x="266" y="157" font-size="11.5" fill="#1e293b">Страница: React + Tailwind (статични файлове, строг CSP)</text>
  <text x="266" y="176" font-size="11.5" fill="#1e293b">/api/report: проверка на входа · Turnstile · лимит по IP</text>
  <text x="266" y="195" font-size="11.5" fill="#1e293b">/api/file: подписани връзки, само към проверени файлове</text>
  <text x="266" y="214" font-size="11.5" fill="#64748b">режим „поддръжка“ (503) · по желание: връзки между сигналите (D1)</text>

  <rect x="250" y="262" width="210" height="70" rx="10" fill="#ffffff" stroke="#f48120"/>
  <text x="355" y="286" font-size="13" font-weight="700" fill="#9a3f00" text-anchor="middle">R2 (частно хранилище)</text>
  <text x="355" y="306" font-size="11.5" fill="#1e293b" text-anchor="middle">quarantine/ → clean/</text>
  <text x="355" y="322" font-size="11" fill="#64748b" text-anchor="middle">rejected/ · авт. изтриване</text>

  <rect x="490" y="262" width="210" height="70" rx="10" fill="#ffffff" stroke="#f48120"/>
  <text x="595" y="286" font-size="13" font-weight="700" fill="#9a3f00" text-anchor="middle">Email Routing</text>
  <text x="595" y="306" font-size="11.5" fill="#1e293b" text-anchor="middle">mail.&lt;домейн&gt;</text>
  <text x="595" y="322" font-size="11" fill="#64748b" text-anchor="middle">чист текст, без прикачени файлове</text>

  <rect x="490" y="352" width="210" height="56" rx="10" fill="#ffffff" stroke="#f48120"/>
  <text x="595" y="375" font-size="13" font-weight="700" fill="#9a3f00" text-anchor="middle">Access</text>
  <text x="595" y="394" font-size="11" fill="#64748b" text-anchor="middle">вход с код по имейл за /api/file/*</text>

  <!-- GitHub -->
  <rect x="230" y="452" width="490" height="78" rx="14" fill="#f1f5f9" stroke="#64748b"/>
  <text x="246" y="476" font-size="14" font-weight="700" fill="#0f172a">GitHub Actions — сканиране</text>
  <text x="246" y="497" font-size="11.5" fill="#1e293b">ClamAV (вкл. EML/MSG/PDF) · прекодиране на снимки · VirusTotal само по SHA-256</text>
  <text x="246" y="516" font-size="11" fill="#64748b">старт от Worker-а + на всеки час; резултатът → писмо 2 през Worker-а; нищо в публичния лог</text>

  <!-- arrows -->
  <g fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#a)">
    <path d="M180,143 L248,143"/>                       <!-- 1 -->
    <path d="M355,224 L355,260"/>                       <!-- 2 -->
    <path d="M595,224 L595,260"/>                       <!-- 3 -->
    <path d="M700,297 L768,322"/>                       <!-- 3b -->
    <path d="M300,334 L300,450" marker-start="url(#a)"/> <!-- 4 -->
    <path d="M770,345 L768,345 L702,380"/>              <!-- 5 -->
    <path d="M490,380 L410,380 L410,334"/>              <!-- 6 -->
  </g>
  <g font-size="11" fill="#334155">
    <text x="186" y="134">сигнал +</text><text x="186" y="160">≤10 файла</text>
    <text x="362" y="246">файлове</text>
    <text x="602" y="246">писмо</text>
    <text x="308" y="400">сканира и</text><text x="308" y="414">пуска</text>
    <text x="712" y="404">отваря файл</text>
    <text x="414" y="364">чете clean/</text>
  </g>

  <!-- technologies -->
  <rect x="30" y="556" width="940" height="74" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="578" font-size="12.5" font-weight="700" fill="#0f172a">Технологии</text>
  <text x="46" y="598" font-size="11.5" fill="#1e293b">Cloudflare: Workers (JavaScript) · Static Assets · Turnstile · Rate Limiting · R2 · Email Routing · Access (Zero Trust) · D1</text>
  <text x="46" y="617" font-size="11.5" fill="#1e293b">GitHub Actions · Python 3.12 · ClamAV · Pillow · VirusTotal API v3   |   Фронтенд: React · Tailwind CSS · esbuild   |   Node.js за билд и тестове</text>
</svg>
